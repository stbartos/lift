<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-labelledby="nazev popis" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Arial, sans-serif" font-size="24">
<title id="nazev">Schéma vlnového proudění</title>
<desc id="popis">Vítr přefukuje horský hřeben a v závětří vytváří stojaté vlny. Na jejich vrcholech visí čočkovité oblaky (altocumulus lenticularis), pod první vlnou se točí rotor a kluzák stoupá v části vlny před vrcholem.</desc>
